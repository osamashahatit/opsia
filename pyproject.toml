[project]
name = "opsia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Osama Shahatit", email = "osamaa.shahatit@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
opsia = "opsia:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
